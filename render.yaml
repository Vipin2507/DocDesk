services:
  - type: web
    name: document-builder
    runtime: node
    plan: free # 100% Free tier (No credit card or payment required)
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: ADMIN_EMAIL
        value: admin@buildesk.local
      - key: ADMIN_PASSWORD
        value: Buildesk123!
